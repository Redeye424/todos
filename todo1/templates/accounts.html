{% extends "base.html" %}
{% load webpush_notifications %}

{% block title %}accounts{% endblock %}

{% block content %}

<div style="color:white;text-align:center;">

<h1>info stuff</h1>

<h2>sign out here</h2>

<form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    <input type="hidden" name="action" value="logout">
    <button class="button" type="submit">
        Logout
    </button>
</form>

<h2>turn on notifications here</h2>

<button class="button" onclick="subscribeUser()">Enable Notifications</button>


<script>
async function subscribeUser() {

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
        alert("Notifications denied");
        return;
    }

    const registration = await navigator.serviceWorker.ready;

    const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(
            "BHekIsfAotwpVjD-UKdhs2Sg3y50S-4nQAfOWNa9RUQ0AKZ8ITeCs1bMycIIxBxIa9QCBynwaVoHeDQZiFOK1RQ"
        )
    });

    await fetch("/save-webpush/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify(subscription)
    });

    alert("Notifications enabled!");
}


function getCookie(name) {
    let value = null;

    document.cookie.split(";").forEach(cookie => {
        cookie = cookie.trim();

        if (cookie.startsWith(name + "=")) {
            value = decodeURIComponent(
                cookie.substring(name.length + 1)
            );
        }
    });

    return value;
}


function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat(
        (4 - base64String.length % 4) % 4
    );

    const base64 = (base64String + padding)
        .replace(/\-/g, "+")
        .replace(/_/g, "/");

    const rawData = window.atob(base64);

    return Uint8Array.from(
        [...rawData].map(char => char.charCodeAt(0))
    );
}
</script>
</div>

{% endblock %}
